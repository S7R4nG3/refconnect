# Test gateway N0CALL with one homebrew repeater, module B. It must stay off
# the real networks: ircDDB, APRS and host-file downloads are disabled, and
# run.sh maps auth.dstargateway.org (DPlus login, started whenever DPlus is
# enabled) to 127.0.0.1.
#
# The "repeater" is the gateway test itself: traffic the gateway would put on
# the air goes to host.docker.internal:20011 as homebrew (DSRP) packets.
# entrypoint.sh fills in its IP (the gateway takes at most 15 characters).

[Gateway]
type=repeater
callsign=N0CALL
address=0.0.0.0
hbAddress=0.0.0.0
hbPort=20010
latitude=0.0
longitude=0.0
language=english_us

[ircddb_1]
enabled=false
[ircddb_2]
enabled=false
[ircddb_3]
enabled=false
[ircddb_4]
enabled=false

[Repeater_1]
enabled=true
band=B
callsign=
address=@RPT_ADDRESS@
port=20011
type=hb
reflector=
reflectorAtStartup=false
reflectorReconnect=never
frequency=434.0
offset=0.0
rangeKm=1
latitude=0.0
longitude=0.0
[Repeater_2]
enabled=false
[Repeater_3]
enabled=false
[Repeater_4]
enabled=false

[APRS]
enabled=false

[Log]
path=/var/log/dstargateway/
fileLevel=none
displayLevel=debug
repeatThreshold=disabled

[Paths]
data=/usr/local/share/dstargateway.d/

[HostsFiles]
downloadedHostsFiles=/usr/local/share/dstargateway.d/
customHostsfiles=/usr/local/share/dstargateway.d/hostfiles.d/

[DExtra]
enabled=true
maxDongles=5
hostfileUrl=

[DPlus]
enabled=true
maxDongles=5
login=N0CALL
hostfileUrl=

[DCS]
enabled=true
hostfileUrl=

[XLX]
enabled=false
hostfileUrl=

[DRats]
enabled=false

[Remote]
enabled=false

[AccessControl]
whiteList=
blackList=
restrictList=

[Daemon]
daemon=false
