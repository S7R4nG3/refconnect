# Test gateway N0CALL, repeater module B, kept off the real networks. The
# repeater is the test on the host; entrypoint.sh fills in the host's IP.

[Gateway]
type=repeater
callsign=N0CALL
address=0.0.0.0
hbAddress=0.0.0.0
hbPort=20010
latitude=0.0
longitude=0.0
language=english_us

[ircddb_1]
enabled=false
[ircddb_2]
enabled=false
[ircddb_3]
enabled=false
[ircddb_4]
enabled=false

[Repeater_1]
enabled=true
band=B
callsign=
address=@RPT_ADDRESS@
port=20011
type=hb
reflector=
reflectorAtStartup=false
reflectorReconnect=never
frequency=434.0
offset=0.0
rangeKm=1
latitude=0.0
longitude=0.0
[Repeater_2]
enabled=false
[Repeater_3]
enabled=false
[Repeater_4]
enabled=false

[APRS]
enabled=false

[Log]
path=/var/log/dstargateway/
fileLevel=none
displayLevel=debug
repeatThreshold=disabled

[Paths]
data=/usr/local/share/dstargateway.d/

[HostsFiles]
downloadedHostsFiles=/usr/local/share/dstargateway.d/
customHostsfiles=/usr/local/share/dstargateway.d/hostfiles.d/

[DExtra]
enabled=true
maxDongles=5
hostfileUrl=

[DPlus]
enabled=true
maxDongles=5
login=N0CALL
hostfileUrl=

[DCS]
enabled=true
hostfileUrl=

[XLX]
enabled=false
hostfileUrl=

[DRats]
enabled=false

[Remote]
enabled=false

[AccessControl]
whiteList=
blackList=
restrictList=

[Daemon]
daemon=false
