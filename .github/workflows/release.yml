name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Package
        run: |
          cp docs/antenna.png refconnect.png
          cp configs/refconnect.desktop refconnect.desktop
          tar -czf refconnect_linux_amd64.tar.gz refconnect refconnect.png refconnect.desktop

      - name: Build .deb / .rpm (nFPM)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          chmod +x packaging/scripts/*.sh
          GLIBC_MIN="$(sh packaging/glibc-min.sh refconnect)"
          export GLIBC_MIN
          echo "glibc floor: ${GLIBC_MIN}"
          VERSION="${GITHUB_REF_NAME#v}" ARCH=amd64 $(go env GOPATH)/bin/nfpm package --packager deb --config packaging/nfpm.yaml --target .
          VERSION="${GITHUB_REF_NAME#v}" ARCH=amd64 $(go env GOPATH)/bin/nfpm package --packager rpm --config packaging/nfpm.yaml --target .
          ls -l refconnect*.deb refconnect*.rpm

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          VERSION="${GITHUB_REF_NAME#v}" APPIMAGETOOL="$PWD/squashfs-root/AppRun" bash packaging/build-appimage.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_linux_amd64
          path: |
            refconnect_linux_amd64.tar.gz
            refconnect*.deb
            refconnect*.rpm
            refconnect*.AppImage

  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Package
        run: |
          cp docs/antenna.png refconnect.png
          cp configs/refconnect.desktop refconnect.desktop
          tar -czf refconnect_linux_arm64.tar.gz refconnect refconnect.png refconnect.desktop

      - name: Build .deb / .rpm (nFPM)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          chmod +x packaging/scripts/*.sh
          GLIBC_MIN="$(sh packaging/glibc-min.sh refconnect)"
          export GLIBC_MIN
          echo "glibc floor: ${GLIBC_MIN}"
          VERSION="${GITHUB_REF_NAME#v}" ARCH=arm64 $(go env GOPATH)/bin/nfpm package --packager deb --config packaging/nfpm.yaml --target .
          VERSION="${GITHUB_REF_NAME#v}" ARCH=arm64 $(go env GOPATH)/bin/nfpm package --packager rpm --config packaging/nfpm.yaml --target .
          ls -l refconnect*.deb refconnect*.rpm

      - name: Build AppImage
        env:
          ARCH: aarch64
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-aarch64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          VERSION="${GITHUB_REF_NAME#v}" APPIMAGETOOL="$PWD/squashfs-root/AppRun" bash packaging/build-appimage.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_linux_arm64
          path: |
            refconnect_linux_arm64.tar.gz
            refconnect*.deb
            refconnect*.rpm
            refconnect*.AppImage

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Bundle .app
        run: |
          mkdir -p RefConnect.app/Contents/MacOS
          mkdir -p RefConnect.app/Contents/Resources
          cp refconnect RefConnect.app/Contents/MacOS/
          cp configs/Info.plist RefConnect.app/Contents/

      - name: Generate AppIcon.icns
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     docs/antenna.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     docs/antenna.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   docs/antenna.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o RefConnect.app/Contents/Resources/AppIcon.icns

      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - RefConnect.app

      - name: Package
        run: zip -r refconnect_darwin_arm64.zip RefConnect.app

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_darwin_arm64
          path: refconnect_darwin_arm64.zip

  build-macos-amd64:
    name: Build macOS (amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOARCH: amd64
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-arch x86_64"
          CGO_LDFLAGS: "-arch x86_64"
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Bundle .app
        run: |
          mkdir -p RefConnect.app/Contents/MacOS
          mkdir -p RefConnect.app/Contents/Resources
          cp refconnect RefConnect.app/Contents/MacOS/
          cp configs/Info.plist RefConnect.app/Contents/

      - name: Generate AppIcon.icns
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     docs/antenna.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     docs/antenna.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   docs/antenna.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o RefConnect.app/Contents/Resources/AppIcon.icns

      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - RefConnect.app

      - name: Package
        run: zip -r refconnect_darwin_amd64.zip RefConnect.app

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_darwin_amd64
          path: refconnect_darwin_amd64.zip

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Embed icon into .exe
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres simply --icon docs/antenna.png --arch amd64

      - name: Build
        run: go build -ldflags="-s -w -H=windowsgui" -o refconnect.exe .

      - name: Package
        run: Compress-Archive -Path refconnect.exe -DestinationPath refconnect_windows_amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_windows_amd64
          path: refconnect_windows_amd64.zip

  release:
    name: Create Release
    needs: [build-linux, build-linux-arm64, build-macos, build-macos-amd64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
