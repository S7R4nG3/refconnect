name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Package
        run: |
          cp docs/antenna.png refconnect.png
          cp configs/refconnect.desktop refconnect.desktop
          tar -czf refconnect_linux_amd64.tar.gz refconnect refconnect.png refconnect.desktop

      - name: Build .deb / .rpm (nFPM)
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.PKG_SIGNING_KEY_PASSPHRASE }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          chmod +x packaging/scripts/*.sh
          GLIBC_MIN="$(sh packaging/glibc-min.sh refconnect)"
          export GLIBC_MIN
          echo "glibc floor: ${GLIBC_MIN}"
          if [ -n "${PKG_SIGNING_KEY}" ]; then
            printf '%s\n' "${PKG_SIGNING_KEY}" > "${RUNNER_TEMP}/pkg-signing.asc"
            export RPM_SIGNING_KEY_FILE="${RUNNER_TEMP}/pkg-signing.asc"
          elif [ "${GITHUB_REPOSITORY}" = "S7R4nG3/refconnect" ]; then
            echo "::error::PKG_SIGNING_KEY secret is not set; the DNF repo needs signed rpms"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" ARCH=amd64 $(go env GOPATH)/bin/nfpm package --packager deb --config packaging/nfpm.yaml --target .
          VERSION="${GITHUB_REF_NAME#v}" ARCH=amd64 $(go env GOPATH)/bin/nfpm package --packager rpm --config packaging/nfpm.yaml --target .
          ls -l refconnect*.deb refconnect*.rpm

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          VERSION="${GITHUB_REF_NAME#v}" APPIMAGETOOL="$PWD/squashfs-root/AppRun" bash packaging/build-appimage.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_linux_amd64
          path: |
            refconnect_linux_amd64.tar.gz
            refconnect*.deb
            refconnect*.rpm
            refconnect*.AppImage

  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Package
        run: |
          cp docs/antenna.png refconnect.png
          cp configs/refconnect.desktop refconnect.desktop
          tar -czf refconnect_linux_arm64.tar.gz refconnect refconnect.png refconnect.desktop

      - name: Build .deb / .rpm (nFPM)
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.PKG_SIGNING_KEY_PASSPHRASE }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          chmod +x packaging/scripts/*.sh
          GLIBC_MIN="$(sh packaging/glibc-min.sh refconnect)"
          export GLIBC_MIN
          echo "glibc floor: ${GLIBC_MIN}"
          if [ -n "${PKG_SIGNING_KEY}" ]; then
            printf '%s\n' "${PKG_SIGNING_KEY}" > "${RUNNER_TEMP}/pkg-signing.asc"
            export RPM_SIGNING_KEY_FILE="${RUNNER_TEMP}/pkg-signing.asc"
          elif [ "${GITHUB_REPOSITORY}" = "S7R4nG3/refconnect" ]; then
            echo "::error::PKG_SIGNING_KEY secret is not set; the DNF repo needs signed rpms"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" ARCH=arm64 $(go env GOPATH)/bin/nfpm package --packager deb --config packaging/nfpm.yaml --target .
          VERSION="${GITHUB_REF_NAME#v}" ARCH=arm64 $(go env GOPATH)/bin/nfpm package --packager rpm --config packaging/nfpm.yaml --target .
          ls -l refconnect*.deb refconnect*.rpm

      - name: Build AppImage
        env:
          ARCH: aarch64
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-aarch64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          VERSION="${GITHUB_REF_NAME#v}" APPIMAGETOOL="$PWD/squashfs-root/AppRun" bash packaging/build-appimage.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_linux_arm64
          path: |
            refconnect_linux_arm64.tar.gz
            refconnect*.deb
            refconnect*.rpm
            refconnect*.AppImage

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Bundle .app
        run: |
          mkdir -p RefConnect.app/Contents/MacOS
          mkdir -p RefConnect.app/Contents/Resources
          cp refconnect RefConnect.app/Contents/MacOS/
          cp configs/Info.plist RefConnect.app/Contents/

      - name: Generate AppIcon.icns
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     docs/antenna.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     docs/antenna.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   docs/antenna.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o RefConnect.app/Contents/Resources/AppIcon.icns

      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - RefConnect.app

      - name: Package
        run: zip -r refconnect_darwin_arm64.zip RefConnect.app

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_darwin_arm64
          path: refconnect_darwin_arm64.zip

  build-macos-amd64:
    name: Build macOS (amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOARCH: amd64
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-arch x86_64"
          CGO_LDFLAGS: "-arch x86_64"
        run: go build -ldflags="-s -w" -o refconnect .

      - name: Bundle .app
        run: |
          mkdir -p RefConnect.app/Contents/MacOS
          mkdir -p RefConnect.app/Contents/Resources
          cp refconnect RefConnect.app/Contents/MacOS/
          cp configs/Info.plist RefConnect.app/Contents/

      - name: Generate AppIcon.icns
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     docs/antenna.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     docs/antenna.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     docs/antenna.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   docs/antenna.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   docs/antenna.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   docs/antenna.png --out AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o RefConnect.app/Contents/Resources/AppIcon.icns

      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - RefConnect.app

      - name: Package
        run: zip -r refconnect_darwin_amd64.zip RefConnect.app

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_darwin_amd64
          path: refconnect_darwin_amd64.zip

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Embed icon into .exe
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres simply --icon docs/antenna.png --arch amd64

      - name: Build
        run: go build -ldflags="-s -w -H=windowsgui" -o refconnect.exe .

      - name: Package
        run: Compress-Archive -Path refconnect.exe -DestinationPath refconnect_windows_amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: refconnect_windows_amd64
          path: refconnect_windows_amd64.zip

  release:
    name: Create Release
    needs: [build-linux, build-linux-arm64, build-macos, build-macos-amd64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-repos:
    name: Publish APT/DNF repos (GitHub Pages)
    needs: release
    if: github.repository == 'S7R4nG3/refconnect'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: refconnect_linux_*
          path: pkgs
          merge-multiple: true

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c

      - name: Import signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          printf '%s\n' "${PKG_SIGNING_KEY}" | gpg --batch --import
          echo "SIGNING_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "${GITHUB_ENV}"

      - name: Build repos
        env:
          SIGNING_KEY_PASSPHRASE: ${{ secrets.PKG_SIGNING_KEY_PASSPHRASE }}
        run: sh packaging/build-repos.sh pkgs site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

  verify-repos:
    name: Verify install (${{ matrix.image }}, ${{ matrix.arch }}, ${{ matrix.mode }})
    needs: publish-repos
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'fedora:latest']
        arch: [amd64, arm64]
        mode: [fresh]
        include:
          # Upgrade from the previous release's package, as an existing user would.
          - { image: 'ubuntu:24.04', arch: amd64, mode: upgrade }
          - { image: 'fedora:latest', arch: amd64, mode: upgrade }
    env:
      SITE: https://s7r4ng3.github.io/refconnect
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Pages can serve the previous deploy for a few minutes.
      - name: Wait for the new repo to be live
        run: |
          V="${GITHUB_REF_NAME#v}"
          for _ in $(seq 60); do
            PRIMARY="$(curl -fsS "${SITE}/rpm/repodata/repomd.xml" | grep -o 'repodata/[^"]*-primary\.xml\.[a-z]*' || true)"
            case "${PRIMARY}" in *.zst) UNZIP=zstd ;; *) UNZIP=gzip ;; esac
            if curl -fsS "${SITE}/apt/dists/stable/main/binary-${{ matrix.arch }}/Packages" | grep -qx "Version: ${V}-1" \
               && [ -n "${PRIMARY}" ] \
               && curl -fsS "${SITE}/rpm/${PRIMARY}" | "${UNZIP}" -dc | grep -q "ver=\"${V}\""; then
              echo "repo serves ${V}"; exit 0
            fi
            sleep 15
          done
          echo "::error::${SITE} still does not serve ${V} after 15 minutes"; exit 1

      - name: Fetch previous release package
        if: matrix.mode == 'upgrade'
        id: old
        run: |
          PREV="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq \
            "[.[] | select(.draft|not) | select(.prerelease|not) | select(.tag_name != \"${GITHUB_REF_NAME}\")][0].tag_name")"
          case "${{ matrix.image }}" in
            fedora*) PAT="refconnect-*.x86_64.rpm" ;;
            *) PAT="refconnect_*_amd64.deb" ;;
          esac
          mkdir old
          if [ -n "${PREV}" ] && gh release download "${PREV}" -p "${PAT}" -D old 2>/dev/null; then
            echo "path=$(ls old/*)" >> "${GITHUB_OUTPUT}"
            echo "upgrading from ${PREV}"
          else
            echo "::notice::${PREV:-no previous release} has no ${PAT}; skipping the upgrade test"
          fi

      - name: Install in ${{ matrix.image }}
        if: matrix.mode == 'fresh' || steps.old.outputs.path != ''
        run: |
          OLD="${{ steps.old.outputs.path }}"
          mkdir -p old
          docker run --rm \
            -v "$PWD/packaging/test-install.sh:/test-install.sh:ro" \
            -v "$PWD/old:/old:ro" \
            "${{ matrix.image }}" sh /test-install.sh "${SITE}" "${GITHUB_REF_NAME#v}" ${OLD:+"/${OLD}"}
